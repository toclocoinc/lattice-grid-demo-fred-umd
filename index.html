<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The US economy, as it was published</title>
    <meta
      name="description"
      content="Forty-seven headline US economic series from FRED, with the numbers as they were first announced set beside the numbers as they stand today. Built with Lattice Grid loaded by script tag, with no install and no build."
    />
    <link rel="icon" href="data:," />
    <!--
      The grid's stylesheet, from jsDelivr. Every address on this page names
      the exact release, 1.83.1, and carries the hash of the file it expects,
      so the page can never quietly pick up a different build than the one it
      was checked against.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.86.7/lattice-grid.min.css"
      integrity="sha384-bP2tRy+qPdagPq/4CKyjoyftz6bWIFsiCzV6pvEHOeu1Io190MU7Nn5JTcyjR+PS"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <div class="loading">
        <h1>The US economy, as it was published</h1>
        <p class="loading-message">Starting...</p>
      </div>
    </main>
    <footer style="margin:0;padding:8px 20px 12px;font-size:12px">Built with <a href="https://www.latticegrid.dev/charts/">Lattice Grid</a></footer>

    <!--
      The library, as classic script tags. No npm install, no bundler, no
      `type="module"`: each file runs as it arrives and leaves a global behind.

        lattice-grid.min.js          LatticeGrid            the grid itself
        modules/charts.min.js        LatticeGrid.createChart  (extends the core, so it must follow it)
        modules/data-router.min.js   LatticeGridDataRouter
        modules/kpi.min.js           LatticeGridKPI
        modules/tabs.min.js          LatticeGridTabs

      The order matters once: the charts module folds itself into the core
      global rather than defining its own, so the core has to be there first.
      The other three are self-contained and could go in any order.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.86.7/lattice-grid.min.js"
      integrity="sha384-z2eFCUE738zQyd5FNPWvP9EdekuhKcBJ4phuzDhLCVCD8AAccOrZE9vlAKeTvu5o"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.86.7/modules/charts.min.js"
      integrity="sha384-DR350X93bzdcEwzlDDyLbiTzIIrv4YhmqgM0weGJiILI1PdAyQdrqsPUjcit7z3P"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.86.7/modules/data-router.min.js"
      integrity="sha384-noKbL93o5uOwW7iDP65oEODz4vdiisXFjQhXeYL+dXozh0XVasd7BW7io4TfJsAl"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.86.7/modules/kpi.min.js"
      integrity="sha384-JN5dDd44ptNb8DI2/wG1muUCovjub7knYcRIx7hOaXZXvJHEz7f+7E8Dk78sx415"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.86.7/modules/tabs.min.js"
      integrity="sha384-1tO9jj9jsUY+D36oD7liLOonmKhf5WV3lVVXRBl8u6mGo47tKJW36XNgsbL79L3v"
      crossorigin="anonymous"
    ></script>

    <!-- The demo's own code, in the order each file needs the one before it. -->
    <script src="./src/licence.js"></script>
    <script src="./src/fred-data.js"></script>
    <script src="./src/timeline.js"></script>
    <script src="./src/vintages.js"></script>
    <script src="./src/dashboard.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
